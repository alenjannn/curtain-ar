name: simply_curtains_ar
description: Simply Curtains AR MVP - curtain preview feasibility prototype
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ar_flutter_plugin_updated: ^0.0.1     # USE THIS. NOT ar_flutter_plugin (abandoned 2022).
                                        # 0.0.1 is the ONLY published version of the fork —
                                        # 0.7.3 is the abandoned original's version number.
  arkit_plugin: ^1.0.9                  # iOS ARKit direct access + LiDAR
  flutter_3d_controller: ^2.3.0         # GLB model loading and rendering (1.4.1 was never published)
  sensors_plus: ^4.0.2                  # Gyroscope for jitter dampening
  vector_math: ^2.1.4                   # 3D coordinate math
  permission_handler: ^11.3.1           # Camera permission
  flutter_animate: ^4.5.0               # UI animations
  path_provider: ^2.1.4                 # ar_flutter_plugin_updated can only load a local model
                                        # via NodeType.fileSystemAppFolderGLB, which resolves
                                        # against the app documents dir — so bundled .glb assets
                                        # must be copied there at runtime.
  gal: ^2.3.3                           # Screenshot saving. Replaces image_gallery_saver,
                                        # which is unbuildable: it still references the
                                        # v1 embedding's PluginRegistry.Registrar.
  flutter_unity_widget: ^2022.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/curtain.glb
    - assets/models/curtain1.glb
    - assets/models/placement_rect.glb
    - assets/textures/plane_grid.png
    - assets/textures/swatch_white.png
    - assets/textures/swatch_beige.png
    - assets/textures/swatch_grey.png
    - assets/textures/swatch_brown.png
